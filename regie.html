<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16131f" />
    <title>Régie — Gnomes vs Gobelins</title>
    <style>
      :root { --bg: #16131f; --panel: #221d30; --line: #3a3350; --text: #ece6f8; --muted: #a098b0; --gnome: #7fb0ff; --goblin: #9be05a; --accent: #ffe14a; --danger: #ff7a7a; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; overflow: hidden; }
      /* Régie à gauche, arène toujours visible à droite ; la séparation se déplace. */
      .split { display: flex; height: 100vh; }
      #left { flex: 0 0 var(--left, 66.6%); overflow: auto; min-width: 320px; }
      #splitter { flex: 0 0 8px; cursor: col-resize; background: var(--line); }
      #splitter:hover, #splitter.dragging { background: var(--accent); }
      #right { flex: 1 1 auto; display: flex; flex-direction: column; background: #000; min-width: 240px; }
      /* L'aperçu se regarde seulement : tout se pilote depuis la régie. */
      #preview { flex: 1 1 auto; border: 0; width: 100%; background: #0e0c14; pointer-events: none; }
      #previewControls { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 20px; background: var(--panel); border-bottom: 2px solid var(--line); }
      #previewControls .tag { font: 10px "Press Start 2P", monospace; color: var(--accent); }
      #previewLabel { flex: 1 1 200px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .spacer { flex: 1 1 auto; }
      button.small { padding: 6px 8px; font-size: 9px; }
      /* Réglages en accordéons */
      details.group { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0; background: #1b1727; }
      details.group > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; padding: 10px 12px; font-weight: 600; user-select: none; }
      details.group > summary::-webkit-details-marker { display: none; }
      details.group > summary::before { content: '▸'; color: var(--accent); transition: transform 0.15s; }
      details.group[open] > summary::before { transform: rotate(90deg); }
      details.group > summary .sum { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
      details.group > .body { padding: 2px 12px 10px; }
      details.group > .body .actions { display: flex; gap: 8px; margin-top: 6px; }
      header { padding: 16px 20px; border-bottom: 2px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      h1 { font: 16px "Press Start 2P", monospace; margin: 0; color: var(--accent); }
      h2 { font: 12px "Press Start 2P", monospace; margin: 0 0 12px; color: var(--accent); }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 16px; }
      section { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 16px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
      tbody tr.pick { cursor: pointer; }
      tbody tr.pick:hover { background: #2e2740; }
      tbody tr.selected { background: #3d3555; outline: 2px solid var(--accent); }
      button { font: 11px "Press Start 2P", monospace; padding: 10px 12px; background: #3d6cc4; color: #fff; border: 3px solid #000; cursor: pointer; }
      button.danger { background: #a02030; }
      button.ok { background: #3f9e4a; }
      button:disabled { opacity: 0.5; cursor: default; }
      input, select, textarea { background: #120f1a; color: var(--text); border: 1px solid var(--line); padding: 6px; border-radius: 4px; font: inherit; }
      input[type='number'] { width: 70px; }
      label.slider { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(100px, 2fr) 64px; gap: 10px; }
      label.slider input[type='range'] { width: 100%; accent-color: var(--accent); padding: 0; background: none; border: 0; }
      label.slider output { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); }
      label { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 4px 0; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
      .muted { color: var(--muted); }
      .gnomes { color: var(--gnome); }
      .goblins { color: var(--goblin); }
      .msg { padding: 8px; border-radius: 4px; margin-top: 8px; }
      .msg.err { background: #4a1a22; color: var(--danger); }
      .msg.okmsg { background: #1a3a22; color: var(--goblin); }
      .wide { grid-column: 1 / -1; }
      section.offline { border-color: var(--accent); }
      #theme { max-width: 220px; }
      /* Téléphone (régie à distance) : l'arène en haut, toujours visible, la régie défile dessous ;
         cibles tactiles d'au moins 44 px, champs en 16 px (sinon iOS zoome à la saisie). */
      @media (max-width: 820px), (pointer: coarse) and (max-width: 1100px) {
        body { overflow: auto; font-size: 16px; }
        .split { display: flex; flex-direction: column; height: auto; }
        #right { order: 1; position: sticky; top: 0; z-index: 5; flex: 0 0 auto; height: 42vh; height: 42svh; min-width: 0; border-bottom: 2px solid var(--line); }
        #left { order: 2; flex: 1 1 auto; overflow: visible; min-width: 0; }
        #splitter, .ratio { display: none; }
        header { padding: 10px 12px; gap: 8px; }
        header h1 { font-size: 12px; }
        header select { flex: 1 1 40%; min-width: 0; }
        #arcInfo { flex: 1 1 100%; font-size: 13px; }
        #previewControls { position: static; padding: 8px 12px; gap: 8px; }
        #previewLabel { flex: 1 1 100%; order: -1; font-size: 13px; }
        #previewControls button { flex: 1 1 0; }
        main { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
        main > section { min-width: 0; overflow-wrap: anywhere; }
        section { padding: 12px; }
        button { min-height: 44px; padding: 10px; touch-action: manipulation; }
        button.small { min-height: 40px; }
        input, select, textarea { font-size: 16px; min-height: 44px; }
        input[type='number'] { width: 90px; }
        input[type='checkbox'] { width: 24px; height: 24px; min-height: 0; }
        label.slider { grid-template-columns: 1fr 64px; row-gap: 0; }
        label.slider > span { grid-column: 1; }
        label.slider output { grid-column: 2; grid-row: 1; }
        label.slider input[type='range'] { grid-column: 1 / -1; height: 36px; }
        details.group > summary { padding: 14px 12px; }
        table { font-size: 13px; display: block; overflow-x: auto; }
        tbody tr.pick td { padding: 10px 6px; }
        .row { gap: 10px; }
        /* Une vue à la fois : l'arène en plein écran, ou la régie ; le bouton flottant bascule en un geste. */
        body.view-arena { overflow: hidden; }
        body.view-arena #left { display: none; }
        body.view-arena #right { position: fixed; inset: 0; height: 100vh; height: 100dvh; border: 0; }
        body.view-regie #right { display: none; }
        body.view-regie #left { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
        nav#viewBar { display: flex; }
      }
      #viewBar { display: none; position: fixed; z-index: 20; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); gap: 8px; }
      #viewBar button { min-height: 52px; padding: 12px 16px; font-size: 12px; border-radius: 26px; border-width: 3px; box-shadow: 0 4px 14px #000a; }
      #viewBar #viewToggle { background: var(--accent); color: #000; }
      body.view-regie #viewReplay { display: none; }
    </style>
  </head>
  <body>
    <div class="split">
    <div id="left">
    <header>
      <h1>RÉGIE</h1>
      <select id="arc" aria-label="Arc"></select>
      <select id="theme" aria-label="Thème"></select>
      <span id="arcInfo" class="muted"></span>
      <span class="spacer ratio"></span>
      <span class="muted ratio">Largeur :</span>
      <button data-ratio="0.666" class="small ratio">2/3</button>
      <button data-ratio="0.75" class="small ratio">3/4</button>
      <button data-ratio="0.8" class="small ratio">4/5</button>
    </header>
    <div id="previewControls">
      <span class="tag">APERÇU</span>
      <span id="previewLabel">…</span>
      <button id="replay">↻ Rejouer</button>
      <button id="randomSeed">🎲 Seed aléatoire</button>
      <button id="fullscreen">⛶ En grand</button>
    </div>
    <main id="app"></main>
    </div>
    <div id="splitter" title="Glisser pour redimensionner"></div>
    <div id="right">
      <iframe id="preview" title="Aperçu de l'arène" tabindex="-1"></iframe>
    </div>
    </div>
    <nav id="viewBar" aria-label="Vue">
      <button id="viewReplay" aria-label="Rejouer">↻</button>
      <button id="viewToggle">⚙ Régie</button>
    </nav>
    <script type="module" src="/src/regie/regie.ts"></script>
  </body>
</html>
